<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#020503">
    <title>Birthday Archive — Prototype 3</title>
    <link rel="stylesheet" href="selector.css">
    <link rel="stylesheet" href="password-gate.css">
  </head>
  <body>
    <canvas id="matrixCanvas" aria-hidden="true"></canvas>
    <div class="noise"></div>
    <section class="access-gate" id="accessGate" lang="en" aria-labelledby="accessTitle">
      <div class="access-window">
        <header><span>BIRTHDAY ARCHIVE · ACCESS CONTROL</span><i></i><i></i><i></i></header>
        <div class="access-body">
          <p>PRIVATE ARCHIVE</p>
          <h1 id="accessTitle">ENTER<br>PASSWORD</h1>
          <form id="accessForm">
            <label for="accessCode">ACCESS CODE · 4 DIGITS</label>
            <div>
              <input id="accessCode" name="accessCode" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-describedby="accessMessage" required autofocus>
              <button type="submit">ENTER →</button>
            </div>
            <small id="accessMessage" role="status" aria-live="polite">STATUS: WAITING FOR INPUT</small>
          </form>
        </div>
      </div>
    </section>
    <main class="selector selector--single" id="selector">
      <a class="choose start-prototype" href="prototype-3/">
        <span>НАЧАТЬ</span>
        <span>ПРОСМОТР</span>
        <small id="prototypeVersionLabel">ПРОТОТИП 3.62</small>
      </a>
      <div class="system-state system-state--single">
        <span>&gt; ACTIVE BUILD: <b id="activeBuild">3.62</b></span>
        <span>10 SLIDES · TEST NAVIGATION ENABLED</span>
      </div>
    </main>
    <script src="prototype-3/version.js"></script>
    <script src="selector.js"></script>
    <script src="password-gate.js"></script>
  </body>
</html>
